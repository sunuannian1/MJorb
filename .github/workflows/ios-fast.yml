name: iOS Fast IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_rustbridge:
        description: Rebuild RustBridge before packaging
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: ios-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-ipa:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Select pinned Xcode 26.5
        run: |
          test -d /Applications/Xcode_26.5.app
          sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.5"

      - name: Install pinned XcodeGen
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version

      - name: Prepare RustBridge
        run: |
          device_lib="Vendor/Minimuxer/RustBridge/lib/RustBridge.xcframework/ios-arm64/librust_bridge.a"
          simulator_lib="Vendor/Minimuxer/RustBridge/lib/RustBridge.xcframework/ios-arm64-simulator/librust_bridge.a"
          required_symbol="_rust_bridge_idevice_lookup_app"

          test -f "$device_lib"
          test -f "$simulator_lib"

          if [[ "${{ inputs.rebuild_rustbridge }}" == "true" ]]; then
            echo "RustBridge rebuild was requested."
          elif xcrun nm -gU "$device_lib" | grep -q "$required_symbol"; then
            echo "Vendored RustBridge already exports $required_symbol; using cached binary."
            exit 0
          else
            echo "Vendored RustBridge is missing $required_symbol; rebuilding before packaging."
          fi

          command -v rustup
          command -v cargo
          command -v make
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          make -C Vendor/Minimuxer/RustBridge xcframework

      - name: Verify vendored RustBridge is present
        run: |
          test -f Vendor/Minimuxer/RustBridge/lib/RustBridge.xcframework/ios-arm64/librust_bridge.a
          test -f Vendor/Minimuxer/RustBridge/lib/RustBridge.xcframework/ios-arm64-simulator/librust_bridge.a
          xcrun nm -gU Vendor/Minimuxer/RustBridge/lib/RustBridge.xcframework/ios-arm64/librust_bridge.a | grep -q "_rust_bridge_idevice_lookup_app"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify Seal minimum deployment target remains iOS 16
        run: |
          TARGET="$(xcodebuild \
            -project Seal.xcodeproj \
            -target Seal \
            -configuration Debug \
            -sdk iphonesimulator \
            -showBuildSettings | awk -F ' = ' '/^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = / { print $2; exit }')"
          echo "Seal IPHONEOS_DEPLOYMENT_TARGET=$TARGET"
          test "$TARGET" = "16.0"

      - name: Verify SealTunnel target and Packet Tunnel configuration
        run: |
          TARGET="$(xcodebuild \
            -project Seal.xcodeproj \
            -target SealTunnel \
            -configuration Debug \
            -sdk iphonesimulator \
            -showBuildSettings | awk -F ' = ' '/^[[:space:]]*IPHONEOS_DEPLOYMENT_TARGET = / { print $2; exit }')"
          echo "SealTunnel IPHONEOS_DEPLOYMENT_TARGET=$TARGET"
          test "$TARGET" = "16.0"
          POINT="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' SealTunnel/Info.plist)"
          test "$POINT" = "com.apple.networkextension.packet-tunnel"
          grep -q "packet-tunnel-provider" SealTunnel/SealTunnel.entitlements
          grep -q "packet-tunnel-provider" Seal/Resources/Seal.entitlements

      - name: Build fast unsigned IPA
        run: SEAL_IPA_CONFIGURATION=Debug SEAL_SKIP_XCODEGEN=1 bash Scripts/build-unsigned-ipa.sh

      - name: Verify unsigned IPA
        run: bash Scripts/verify-ipa.sh build/Seal.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Seal-${{ github.run_number }}
          if-no-files-found: error
          path: |
            build/Seal.ipa
            build/Seal.ipa.sha256
            build/Seal-Info.plist
            build/SealTunnel-Info.plist
          retention-days: 14

      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Seal-Build-Metadata-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            build/Seal.ipa.sha256
            build/Seal-Info.plist
            build/SealTunnel-Info.plist
          retention-days: 14
